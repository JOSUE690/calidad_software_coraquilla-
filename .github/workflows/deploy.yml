name: Deploy React App
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: alumnos
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/var/www/react-app"
